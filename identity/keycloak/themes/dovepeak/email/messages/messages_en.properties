# Dovepeak email texts. Keys marked "tenant" can be overridden per project through realm localization texts
# (Management API: PUT /v1/organizations/{orgId}/projects/{projectId}/branding). Apostrophes are doubled ('')
# because Keycloak formats these messages with java.text.MessageFormat.

# Branding (tenant). Empty means the Dovepeak platform branding.
dovepeakBrandPrimaryColor=
dovepeakBrandPrimaryColorDark=
dovepeakBrandOnPrimaryColor=
dovepeakBrandLogoUrl=

# Email verification. Subject and introduction: tenant.
emailVerificationSubject=Verify your email address
dovepeakEmailVerificationIntro=Thanks for creating a {0} account. Please confirm that this is your email address.
dovepeakEmailVerificationAction=Verify email address
dovepeakEmailVerificationIgnore=If you didn''t create an account, you can safely ignore this email.

# Password reset. Subject and introduction: tenant.
passwordResetSubject=Reset your password
dovepeakPasswordResetIntro=We received a request to reset the password for your {0} account.
dovepeakPasswordResetAction=Choose a new password
dovepeakPasswordResetIgnore=If you didn''t ask to reset your password, ignore this email: your password stays the same.

dovepeakLinkExpiry=This link expires in {0}.
dovepeakLinkFallback=If the button does not work, copy this address into your browser:

# Security alerts (Keycloak "email" event listener), clearer subjects than the defaults.
eventUpdatePasswordSubject=Security alert: your password was changed
eventUpdateCredentialSubject=Security alert: your password or sign-in method changed
eventRemoveCredentialSubject=Security alert: a sign-in method was removed
eventUpdateTotpSubject=Security alert: two-factor authentication was updated
eventRemoveTotpSubject=Security alert: two-factor authentication was removed
eventUserDisabledByTemporaryLockoutSubject=Security alert: your account was temporarily locked
eventUserDisabledByPermanentLockoutSubject=Security alert: your account was locked
