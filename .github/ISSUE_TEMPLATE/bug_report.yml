name: Bug report
description: Report something that is not working as documented.
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        **Do not report security vulnerabilities here.** Follow [SECURITY.md](../../SECURITY.md) instead.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem and what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Management API
        - Developer portal
        - Identity engine configuration
        - TypeScript SDK
        - .NET SDK
        - Deployment / local stack
        - Documentation
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove any secrets, tokens or personal data before pasting.
      render: text
