name: Feature request
description: Propose a new capability or improvement.
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve, and for whom?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security considerations
      description: Does this affect authentication, authorization, tenant isolation or credentials?
  - type: input
    id: milestone
    attributes:
      label: Related milestone
      placeholder: e.g. M3.5
