name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: .NET build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Dovepeak.Identity.slnx

      - name: Check formatting
        run: dotnet format Dovepeak.Identity.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build Dovepeak.Identity.slnx --configuration Release --no-restore

      - name: Test
        run: >-
          dotnet test Dovepeak.Identity.slnx --configuration Release --no-build
          --logger trx --results-directory TestResults
          --collect "XPlat Code Coverage"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-test-results
          path: TestResults
          retention-days: 14

  compose:
    name: Local stack configuration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose file
        run: |
          cp .env.example .env
          docker compose config --quiet

  container:
    name: Management API image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -f services/management-api/Dockerfile -t dovepeak/management-api:ci .

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: dovepeak/management-api:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
