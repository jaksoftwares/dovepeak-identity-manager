name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: .NET build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Dovepeak.Identity.slnx

      - name: Check formatting
        run: dotnet format Dovepeak.Identity.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build Dovepeak.Identity.slnx --configuration Release --no-restore

      - name: Unit tests
        run: >-
          dotnet test Dovepeak.Identity.slnx --configuration Release --no-build
          --filter "Category!=Integration"
          --logger trx --results-directory TestResults
          --collect "XPlat Code Coverage"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-test-results
          path: TestResults
          retention-days: 14

  integration:
    name: Integration and end-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: examples/nextjs-bff/package-lock.json

      - name: Start the stack
        run: |
          cp .env.example .env
          docker compose up -d --build --wait --wait-timeout 900

      - name: Build
        run: dotnet build Dovepeak.Identity.slnx --configuration Release

      - name: Integration tests
        run: >-
          dotnet test tests/Dovepeak.Identity.IntegrationTests --configuration Release --no-build
          --logger trx --results-directory TestResults

      - name: Export the OpenAPI document
        run: |
          curl -sf http://localhost:5080/openapi/v1.json -o openapi-v1.json
          python3 - <<'EOF'
          import json
          doc = json.load(open("openapi-v1.json"))
          paths = doc["paths"]
          assert doc["openapi"].startswith("3."), doc["openapi"]
          assert all(p.startswith("/v1/") for p in paths if p != "/health"), "unversioned path in the API"
          assert "bearer" in json.dumps(doc.get("components", {})).lower(), "security scheme missing"
          print(f"OpenAPI {doc['openapi']}: {len(paths)} paths")
          EOF

      - name: BFF end-to-end test
        run: |
          dotnet run --project tools/Dovepeak.Identity.DevTool --configuration Release --no-build -- demo-setup
          nohup dotnet run --project examples/dotnet-protected-api/Dovepeak.Examples.ProtectedApi \
            --configuration Release --no-build -- \
            --Auth:Issuer=http://localhost:8080/realms/dp-demo --Auth:Audience=dovepeak-demo-api \
            --Auth:RequireHttpsMetadata=false > protected-api.log 2>&1 &
          cd examples/nextjs-bff
          npm ci
          npm run typecheck
          npm run build
          nohup npm start > ../../bff.log 2>&1 &
          cd ../..
          for i in $(seq 1 60); do
            curl -sf http://localhost:3000/ > /dev/null && curl -sf http://localhost:5301/public > /dev/null && break
            sleep 2
          done
          node tests/e2e/bff-smoke.mjs

      - name: Scan logs for leaked secrets
        if: always()
        run: scripts/ci/scan-logs-for-secrets.sh .env

      - name: Collect logs
        if: failure()
        run: docker compose logs --no-color > stack.log

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-results
          path: |
            TestResults
            openapi-v1.json
            stack.log
            protected-api.log
            bff.log
          retention-days: 14

      - name: Stop the stack
        if: always()
        run: docker compose down -v

  compose:
    name: Local stack configuration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose file
        run: |
          cp .env.example .env
          docker compose config --quiet

  container:
    name: Management API image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -f services/management-api/Dockerfile -t dovepeak/management-api:ci .

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: dovepeak/management-api:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
