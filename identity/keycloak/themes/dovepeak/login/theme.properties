# Dovepeak Identity hosted login theme.
# Extends Keycloak's keycloak.v2 (PatternFly 5) theme with CSS only: no templates are copied, so Keycloak
# upgrades do not require merging forked FreeMarker files. Form IDs and field names are unchanged.
parent=keycloak.v2
import=common/keycloak
styles=css/styles.css css/dovepeak.css
stylesCommon=vendor/patternfly-v5/patternfly.min.css vendor/patternfly-v5/patternfly-addons.css
darkMode=false
