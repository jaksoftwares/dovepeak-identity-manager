name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: .NET build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Dovepeak.Identity.slnx

      - name: Check formatting
        run: dotnet format Dovepeak.Identity.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build Dovepeak.Identity.slnx --configuration Release --no-restore

      - name: Unit tests
        run: >-
          dotnet test Dovepeak.Identity.slnx --configuration Release --no-build
          --filter "Category!=Integration"
          --logger trx --results-directory TestResults
          --collect "XPlat Code Coverage"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-test-results
          path: TestResults
          retention-days: 14

  typescript-sdk:
    name: TypeScript SDK build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspaces
        run: npm ci

      - name: Typecheck, build and unit-test the SDK
        run: |
          npm run typecheck -w @dovepeak/identity
          npm run build -w @dovepeak/identity
          npm test -w @dovepeak/identity

      - name: Check the published package contents
        working-directory: sdks/typescript
        run: |
          npm pack --dry-run --json > pack.json
          node -e "const f=require('./pack.json')[0].files.map(x=>x.path); for (const p of ['dist/index.js','dist/node/index.js','dist/next/index.js','dist/react/index.js','README.md','LICENSE']) if (!f.includes(p)) { console.error('missing', p); process.exit(1); } if (f.some(p=>p.startsWith('test')||p.startsWith('src/'))) { console.error('tests or sources would be published'); process.exit(1); }"

  integration:
    name: Integration and end-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            portal/package-lock.json

      - name: Start the stack
        run: |
          cp .env.example .env
          docker compose up -d --build --wait --wait-timeout 900

      - name: Build
        run: dotnet build Dovepeak.Identity.slnx --configuration Release

      - name: Integration tests
        run: >-
          dotnet test tests/Dovepeak.Identity.IntegrationTests --configuration Release --no-build
          --logger trx --results-directory TestResults
          --blame-hang-timeout 15m --blame-hang-dump-type none

      - name: SDK contract tests against Keycloak
        run: |
          npm ci
          npm run build -w @dovepeak/identity
          npm run test:integration -w @dovepeak/identity

      - name: Export the OpenAPI document
        run: |
          curl -sf http://localhost:5080/openapi/v1.json -o openapi-v1.json
          python3 - <<'EOF'
          import json
          doc = json.load(open("openapi-v1.json"))
          paths = doc["paths"]
          assert doc["openapi"].startswith("3."), doc["openapi"]
          assert all(p.startswith("/v1/") for p in paths if p != "/health"), "unversioned path in the API"
          assert "bearer" in json.dumps(doc.get("components", {})).lower(), "security scheme missing"
          print(f"OpenAPI {doc['openapi']}: {len(paths)} paths")
          EOF

      - name: BFF end-to-end test
        run: |
          dotnet run --project tools/Dovepeak.Identity.DevTool --configuration Release --no-build -- demo-setup
          nohup dotnet run --project examples/dotnet-protected-api/Dovepeak.Examples.ProtectedApi \
            --configuration Release --no-build -- \
            --Auth:Issuer=http://localhost:8080/realms/dp-demo --Auth:Audience=dovepeak-demo-api \
            --Auth:RequireHttpsMetadata=false --Cors:AllowedOrigins:0=http://localhost:5173 > protected-api.log 2>&1 &
          npm run typecheck -w @dovepeak/example-nextjs-bff
          npm run build -w @dovepeak/example-nextjs-bff
          nohup npm start -w @dovepeak/example-nextjs-bff > bff.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:3000/ > /dev/null && curl -sf http://localhost:5301/public > /dev/null && break
            sleep 2
          done
          node tests/e2e/bff-smoke.mjs

      - name: React SPA end-to-end test
        run: |
          npm run build -w @dovepeak/example-react-spa
          nohup npm run preview -w @dovepeak/example-react-spa > spa.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:5173/ > /dev/null && break; sleep 2; done
          cd examples/react-spa
          npx playwright install --with-deps chromium
          npx playwright test

      - name: Portal end-to-end tests
        working-directory: portal
        run: |
          npm ci
          npm run typecheck
          npx playwright install --with-deps chromium
          npx playwright test

      - name: Scan logs for leaked secrets
        if: always()
        run: scripts/ci/scan-logs-for-secrets.sh .env

      - name: Collect logs
        if: failure()
        run: docker compose logs --no-color > stack.log

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-results
          path: |
            TestResults
            openapi-v1.json
            portal/playwright-report
            stack.log
            protected-api.log
            bff.log
            spa.log
          retention-days: 14

      - name: Stop the stack
        if: always()
        run: docker compose down -v

  compose:
    name: Local stack configuration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Validate compose file
        run: |
          cp .env.example .env
          docker compose config --quiet

  container:
    name: Container images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -f services/management-api/Dockerfile -t dovepeak/management-api:ci .

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: dovepeak/management-api:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Build portal image
        run: docker build -t dovepeak/portal:ci portal

      - name: Scan portal image for vulnerabilities
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: dovepeak/portal:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
