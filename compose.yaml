# Dovepeak Identity — local development stack.
# Usage: cp .env.example .env && docker compose up -d
# All ports bind to 127.0.0.1 so the stack is not reachable from the local network.

name: dovepeak-identity

services:
  postgres:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?Copy .env.example to .env}
      DOVEPEAK_DB_PASSWORD: ${DOVEPEAK_DB_PASSWORD:?Copy .env.example to .env}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Copy .env.example to .env}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5442}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/local/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  valkey:
    image: valkey/valkey:8.1-alpine
    restart: unless-stopped
    command: ["valkey-server", "--requirepass", "${VALKEY_PASSWORD:?Copy .env.example to .env}", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${VALKEY_HOST_PORT:-6379}:6379"
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a \"$${VALKEY_PASSWORD}\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD}

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    restart: unless-stopped
    command: ["start-dev"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      # Observability (M6.1): latency histograms and per-realm login/registration event counters for SLOs and alerts.
      KC_HTTP_METRICS_HISTOGRAMS_ENABLED: "true"
      KC_EVENT_METRICS_USER_ENABLED: "true"
      KC_EVENT_METRICS_USER_TAGS: realm
      # Traces go to the OpenTelemetry Collector when the observability profile runs (see .env.example).
      KC_TRACING_ENABLED: ${KC_TRACING_ENABLED:-false}
      KC_TRACING_ENDPOINT: http://otel-collector:4317
      KC_TRACING_SERVICE_NAME: keycloak
      # Overlapping client secret rotation (realm template profile "dovepeak-secret-rotation"). A Keycloak preview
      # feature: without it, realm provisioning rejects the template. See ADR-0004 and known limitation L-13.
      KC_FEATURES: client-secret-rotation,user-event-metrics
      # Security alert emails (realm template "email" event listener): credential changes and lockouts.
      # LOGIN_ERROR is excluded so an attacker cannot flood a user's inbox by guessing passwords. Keycloak 26 reports
      # a password or OTP change both as a legacy event and as UPDATE/REMOVE_CREDENTIAL; the legacy ones are excluded
      # so users get exactly one alert per change.
      KC_SPI_EVENTS_LISTENER__EMAIL__EXCLUDE_EVENTS: LOGIN_ERROR,UPDATE_PASSWORD,UPDATE_TOTP,REMOVE_TOTP
      # Public hostname (through the edge proxy) and a separate local-only admin hostname.
      KC_HOSTNAME: http://localhost:${KEYCLOAK_HOST_PORT:-8080}
      KC_HOSTNAME_ADMIN: http://localhost:${KEYCLOAK_ADMIN_HOST_PORT:-8081}
      KC_PROXY_HEADERS: xforwarded
      # Internal callers (Management API, workers) receive internal URLs for keys and endpoints in discovery.
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:?Copy .env.example to .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Copy .env.example to .env}
    ports:
      # Direct access for the admin console and local tooling only. Public traffic goes through "edge".
      - "127.0.0.1:${KEYCLOAK_ADMIN_HOST_PORT:-8081}:8080"
      - "127.0.0.1:${KEYCLOAK_MANAGEMENT_HOST_PORT:-9000}:9000"
    volumes:
      - ./identity/keycloak/themes/dovepeak:/opt/keycloak/themes/dovepeak:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # The Keycloak image has no curl or wget, so the probe uses bash's /dev/tcp.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  keycloak-bootstrap:
    # One-shot job: creates the Management API's least-privilege service account.
    image: quay.io/keycloak/keycloak:26.8.1
    entrypoint: ["/bin/bash", "/bootstrap/bootstrap.sh"]
    restart: "no"
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      MANAGEMENT_CLIENT_ID: ${KEYCLOAK_MANAGEMENT_CLIENT_ID:-dovepeak-management}
      MANAGEMENT_CLIENT_SECRET: ${KEYCLOAK_MANAGEMENT_CLIENT_SECRET:?Copy .env.example to .env}
    volumes:
      - ./identity/keycloak/bootstrap:/bootstrap:ro
    depends_on:
      keycloak:
        condition: service_healthy

  edge:
    # Public entry point: rate limiting and blocking of administrative paths (deploy/local/traefik/dynamic.yml).
    image: traefik:v3.5.3
    restart: unless-stopped
    command:
      - --entrypoints.public.address=:80
      - --entrypoints.ping.address=:8082
      - --ping.entrypoint=ping
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --providers.file.watch=true
      - --api.dashboard=false
      - --log.level=INFO
      - --accesslog=true
      - --accesslog.format=json
      - --accesslog.fields.headers.defaultmode=drop
      # RequestPath includes the query string, which carries single-use action tokens (email verification and
      # password reset links). Traefik cannot redact query strings, so the path is dropped; the matched router
      # name, method, status and duration are kept.
      - --accesslog.fields.names.RequestPath=drop
      - --entrypoints.metrics.address=:8083
      - --metrics.prometheus=true
      - --metrics.prometheus.entryPoint=metrics
      - --metrics.prometheus.addRoutersLabels=true
      - --global.checknewversion=false
      - --global.sendanonymoususage=false
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD}
      EDGE_RATELIMIT_EMAIL_PER_MINUTE: ${EDGE_RATELIMIT_EMAIL_PER_MINUTE:-5}
      EDGE_RATELIMIT_EMAIL_BURST: ${EDGE_RATELIMIT_EMAIL_BURST:-5}
      EDGE_RATELIMIT_CREDENTIALS_PER_MINUTE: ${EDGE_RATELIMIT_CREDENTIALS_PER_MINUTE:-30}
      EDGE_RATELIMIT_CREDENTIALS_BURST: ${EDGE_RATELIMIT_CREDENTIALS_BURST:-20}
      EDGE_RATELIMIT_GENERAL_PER_MINUTE: ${EDGE_RATELIMIT_GENERAL_PER_MINUTE:-600}
      EDGE_RATELIMIT_GENERAL_BURST: ${EDGE_RATELIMIT_GENERAL_BURST:-200}
    ports:
      - "127.0.0.1:${KEYCLOAK_HOST_PORT:-8080}:80"
    volumes:
      - ./deploy/local/traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
    depends_on:
      keycloak:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--entrypoints.ping.address=:8082", "--ping.entrypoint=ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  db-migrate:
    # One-shot job: applies Dovepeak database migrations (EF Core bundle), then exits.
    build:
      context: .
      dockerfile: services/management-api/src/Dovepeak.Identity.Persistence/Dockerfile.migrations
    restart: "no"
    command: ["--connection", "Host=postgres;Port=5432;Database=dovepeak;Username=dovepeak;Password=${DOVEPEAK_DB_PASSWORD}"]
    depends_on:
      postgres:
        condition: service_healthy

  workers:
    build:
      context: .
      dockerfile: services/workers/Dockerfile
    restart: unless-stopped
    environment:
      DOTNET_ENVIRONMENT: Production
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=dovepeak;Username=dovepeak;Password=${DOVEPEAK_DB_PASSWORD};Maximum Pool Size=30;Timeout=15;Command Timeout=30
      Keycloak__BaseUrl: http://keycloak:8080
      Keycloak__ClientId: ${KEYCLOAK_MANAGEMENT_CLIENT_ID:-dovepeak-management}
      Keycloak__ClientSecret: ${KEYCLOAK_MANAGEMENT_CLIENT_SECRET}
      Platform__PublicIdentityUrl: http://localhost:${KEYCLOAK_HOST_PORT:-8080}/
      Platform__ApiKeyDigestKey: ${PLATFORM_API_KEY_DIGEST_KEY:?Copy .env.example to .env}
      Keycloak__HealthUrl: http://keycloak:9000/health/ready
      # The workers provision realms (outbox), so they need the same SMTP settings as the Management API.
      Keycloak__Smtp__Host: mail-relay
      Keycloak__Smtp__Port: "2525"
      Keycloak__Smtp__StartTls: "false"
      Keycloak__Smtp__RealmAsUsername: "true"
      Keycloak__Smtp__Password: ${MAIL_RELAY_PASSWORD:?Copy .env.example to .env}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    stop_grace_period: 30s
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      keycloak-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health/ready > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  mail-relay:
    # Every realm sends email through the relay: per-recipient and per-tenant quotas (L-04) and delivery metrics.
    build:
      context: .
      dockerfile: services/mail-relay/Dockerfile
    restart: unless-stopped
    environment:
      ConnectionStrings__Redis: valkey:6379,password=${VALKEY_PASSWORD}
      Relay__Password: ${MAIL_RELAY_PASSWORD}
      Upstream__Host: ${MAIL_UPSTREAM_HOST:-mailpit}
      Upstream__Port: ${MAIL_UPSTREAM_PORT:-1025}
      Upstream__StartTls: ${MAIL_UPSTREAM_STARTTLS:-false}
      Upstream__Username: ${MAIL_UPSTREAM_USERNAME:-}
      Upstream__Password: ${MAIL_UPSTREAM_PASSWORD:-}
      Quotas__PerRecipientPerHour: ${MAIL_QUOTA_PER_RECIPIENT_PER_HOUR:-5}
      Quotas__PerRecipientPerDay: ${MAIL_QUOTA_PER_RECIPIENT_PER_DAY:-20}
      Quotas__PerTenantPerHour: ${MAIL_QUOTA_PER_TENANT_PER_HOUR:-500}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    stop_grace_period: 30s
    depends_on:
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health/ready > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_HOST_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_HOST_PORT:-8025}:8025"

  management-api:
    build:
      context: .
      dockerfile: services/management-api/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=dovepeak;Username=dovepeak;Password=${DOVEPEAK_DB_PASSWORD};Maximum Pool Size=30;Timeout=15;Command Timeout=30
      ConnectionStrings__Redis: valkey:6379,password=${VALKEY_PASSWORD},abortConnect=false
      Keycloak__HealthUrl: http://keycloak:9000/health/ready
      Keycloak__BaseUrl: http://keycloak:8080
      Keycloak__ClientId: ${KEYCLOAK_MANAGEMENT_CLIENT_ID:-dovepeak-management}
      Keycloak__ClientSecret: ${KEYCLOAK_MANAGEMENT_CLIENT_SECRET}
      Keycloak__Smtp__Host: mail-relay
      Keycloak__Smtp__RealmAsUsername: "true"
      Keycloak__Smtp__Password: ${MAIL_RELAY_PASSWORD}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      Platform__PublicIdentityUrl: http://localhost:${KEYCLOAK_HOST_PORT:-8080}/
      Platform__ApiKeyDigestKey: ${PLATFORM_API_KEY_DIGEST_KEY:?Copy .env.example to .env}
      Platform__PortalRedirectUris__0: http://localhost:3100/api/auth/callback
      # Integration tests sign developers in through the portal client with this callback (local and CI stack only).
      Platform__PortalRedirectUris__1: http://localhost:3999/callback
      Keycloak__Smtp__Port: "2525"
      Keycloak__Smtp__StartTls: "false"
    stop_grace_period: 30s
    ports:
      - "127.0.0.1:${MANAGEMENT_API_HOST_PORT:-5080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      keycloak-bootstrap:
        condition: service_completed_successfully
      db-migrate:
        condition: service_completed_successfully
      mail-relay:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health/ready > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Developer portal (backend-for-frontend over the Management API). Tokens stay in this server and Valkey.
  portal:
    build:
      context: ./portal
    restart: unless-stopped
    environment:
      PLATFORM_ISSUER: http://localhost:${KEYCLOAK_HOST_PORT:-8080}/realms/dovepeak-platform
      PORTAL_CLIENT_ID: dovepeak-portal
      # The public issuer origin is not reachable from inside the container; server-side calls go here instead.
      IDENTITY_INTERNAL_URL: http://keycloak:8080
      APP_URL: http://localhost:${PORTAL_HOST_PORT:-3100}
      MANAGEMENT_API_URL: http://management-api:8080
      SESSION_REDIS_URL: redis://:${VALKEY_PASSWORD}@valkey:6379/2
      # OTLP/HTTP (port 4318) for the Node.js SDK; empty disables tracing.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_HTTP_ENDPOINT:-}
    ports:
      - "127.0.0.1:${PORTAL_HOST_PORT:-3100}:3100"
    depends_on:
      management-api:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3100/ > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------- Observability (M6.1)
  # docker compose --profile observability up -d   (and set the OTEL_* variables in .env)

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.162.0
    profiles: [observability]
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./deploy/observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro

  tempo:
    image: grafana/tempo:2.10.8
    profiles: [observability]
    restart: unless-stopped
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./deploy/observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo

  prometheus:
    image: prom/prometheus:v3.13.4
    profiles: [observability]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:${PROMETHEUS_HOST_PORT:-9090}:9090"
    volumes:
      - ./deploy/observability/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus

  blackbox:
    image: prom/blackbox-exporter:v0.29.0
    profiles: [observability]
    restart: unless-stopped
    command: ["--config.file=/etc/blackbox/blackbox.yml"]
    volumes:
      - ./deploy/observability/blackbox.yml:/etc/blackbox/blackbox.yml:ro

  alertmanager:
    image: prom/alertmanager:v0.34.1
    profiles: [observability]
    restart: unless-stopped
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    ports:
      - "127.0.0.1:${ALERTMANAGER_HOST_PORT:-9093}:9093"
    volumes:
      - ./deploy/observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro

  grafana:
    image: grafana/grafana:12.4.12
    profiles: [observability]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin_local_only}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports:
      - "127.0.0.1:${GRAFANA_HOST_PORT:-3001}:3000"
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

volumes:
  postgres-data:
  valkey-data:
  tempo-data:
  prometheus-data:
  grafana-data:
